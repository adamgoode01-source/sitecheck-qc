# Build the iOS app and ship it to TestFlight without owning a Mac.
#
# The Xcode project is generated fresh on every run rather than committed, so
# Windows contributors never have to hold a large generated tree in the repo.
# The cost is that anything Capacitor does not generate — the camera usage
# string, the deployment target, the encryption flag — has to be re-applied
# here on each build instead of being set once in Xcode. That is what the
# patch steps below are for. If you later get a Mac and commit `ios/`, delete
# them.
#
# ---------------------------------------------------------------------------
# BEFORE THE FIRST RUN — the parts only you can do
#
#   1. Push this repo to GitHub / GitLab / Bitbucket and add it in Codemagic.
#   2. App Store Connect > Users and Access > Integrations > App Store Connect
#      API: create a key with the "App Manager" role. Download the .p8 once —
#      Apple will not show it again.
#   3. Codemagic > your app > Environment variables: add the key as three
#      variables in a group named `appstore`. See CODEMAGIC_SETUP.md step 4.
#   4. Register the bundle id `com.sitecheck.qc` in your Apple Developer
#      account, and create the matching app record in App Store Connect.
#   5. Push a tag starting with `ios-v` to trigger a build:
#        git tag ios-v0.1.0 && git push origin ios-v0.1.0
# ---------------------------------------------------------------------------

definitions:
  # ARKit raycasting needs iOS 13.0 and the LiDAR sceneReconstruction path
  # needs 13.4, so the plugin podspec sets 14.0. Capacitor generates the app
  # target at 13.0, and CocoaPods refuses to resolve that mismatch.
  ios_deployment_target: &ios_deployment_target '14.0'

workflows:
  ios-testflight:
    name: LiDAR Site Check — iOS TestFlight
    # No explicit instance_type: pinning one your plan does not include leaves
    # the build queued indefinitely waiting for a machine it will never get,
    # with no error to read. Letting Codemagic pick its default for the
    # account avoids that entire failure mode.
    max_build_duration: 60

    # No `integrations:` block on purpose.
    #
    # A named integration has to match a string in Codemagic's UI exactly AND
    # be enabled on this specific app; when either is off, the build dies with
    # `App Store Connect integration "..." does not exist`, which does not say
    # which of the two is wrong. The App Store Connect CLI reads its
    # credentials straight from environment variables instead, so there is one
    # place to get right rather than two.

    environment:
      node: 20
      xcode: latest
      cocoapods: default
      groups:
        # Create this group in Codemagic with exactly these three variables —
        # see CODEMAGIC_SETUP.md. The group name must match this string.
        - appstore
      vars:
        BUNDLE_ID: 'com.sitecheck.qc'
        XCODE_WORKSPACE: 'ios/App/App.xcworkspace'
        XCODE_SCHEME: 'App'
        IOS_DEPLOYMENT_TARGET: *ios_deployment_target
      # No `ios_signing:` block here on purpose.
      #
      # That block is Codemagic's automatic signing, and it only FETCHES
      # provisioning profiles that already exist. A bundle id that has never
      # been built has nothing to fetch, and the build dies with
      # "No matching profiles found for bundle identifier ... and distribution
      # type app_store" — which reads like the bundle id is wrong when in fact
      # it is simply new. Signing is done explicitly in the scripts below so
      # the profile can be created on first run.

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-v*'
          include: true

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $CM_BUILD_DIR/node_modules

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Verify before building
        script: |
          # Cheap, and it beats discovering a type error after a twenty-minute
          # signing and archive cycle.
          npm run typecheck
          npm test

      - name: Build web assets
        script: npm run build

      - name: Generate the iOS project
        script: |
          # `cap add ios` ends by running pod install at Capacitor's default
          # deployment target of 13.0. The ARKit pod requires 14.0, so that
          # first pod install fails — expected, and not fatal. The Xcode
          # project and Podfile it generated are what we actually need; the
          # target gets raised in the next step and pods installed properly
          # after that. Hence `|| true` rather than letting it abort.
          npx cap add ios || echo "cap add reported an error (expected: pod install at the default 13.0 target)"

          if [ ! -d "ios/App" ]; then
            echo "FATAL: cap add did not produce ios/App — this is a real failure, not the expected pod error."
            exit 1
          fi
          echo "iOS project generated."

      - name: Raise the deployment target
        script: |
          # Must happen between project generation and any pod install. The
          # ARKit plugin's podspec requires 14.0 and Capacitor generates 13.0;
          # CocoaPods reports that mismatch as an error naming the pod, which
          # reads like the plugin is broken rather than the target being low.
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '$IOS_DEPLOYMENT_TARGET'/" ios/App/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = $IOS_DEPLOYMENT_TARGET;/g" ios/App/App.xcodeproj/project.pbxproj

          echo "--- Podfile platform line ---"
          grep -n "platform :ios" ios/App/Podfile

      - name: Sync web assets and native dependencies
        script: |
          set -e

          # The plugin is a `file:` dependency, so npm links it into
          # node_modules. CocoaPods resolves the podspec through that link, and
          # if the Swift sources are not visible here the pod builds empty and
          # the app fails at runtime rather than at build time. Checked first
          # because it is invisible in every later error message.
          echo "=== plugin as seen through node_modules ==="
          ls -la node_modules/capacitor-sitecheck-ar/ || echo "PLUGIN NOT LINKED INTO node_modules"
          echo "--- Swift sources ---"
          ls -la node_modules/capacitor-sitecheck-ar/ios/Sources/SiteCheckARPlugin/ \
            || echo "SWIFT SOURCES NOT VISIBLE THROUGH node_modules"

          echo "=== cap copy (web assets only, no pods) ==="
          npx cap copy ios

          echo "=== Podfile as it stands ==="
          cat ios/App/Podfile

          # No --verbose: `cap update` does not accept it and exits 1, which
          # failed the very step the flag was added to make legible.
          echo "=== cap update (native deps, runs pod install) ==="
          npx cap update ios

          echo "=== plugins Capacitor resolved ==="
          # Diagnostic only. Deliberately non-fatal: this must never be the
          # thing that fails a build that otherwise worked.
          npx cap ls ios || true

      - name: Patch Info.plist
        script: |
          PLIST="ios/App/App/Info.plist"

          set_string () {
            /usr/libexec/PlistBuddy -c "Set :$1 $2" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PLIST"
          }

          # Without this the system terminates the app the instant ARKit
          # starts, with no error the web layer can catch.
          set_string NSCameraUsageDescription "SiteCheck uses the camera and depth sensor to measure framing and reinforcing steel on site."
          set_string NSPhotoLibraryUsageDescription "Site photographs can be attached to inspection records."

          # The app is fully offline and uses no encryption beyond the OS, so
          # this is accurate — and it skips the export compliance prompt on
          # every upload.
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"

          # Deliberately NOT setting UIRequiredDeviceCapabilities to arkit:
          # that would block installation on non-AR devices entirely, including
          # an office iPad used only to review reports.

      - name: Generate app icons
        script: |
          # Drop a 1024x1024 PNG at resources/icon.png and this replaces the
          # Capacitor placeholder. Skipped until then — internal TestFlight
          # does not care, external review will.
          if [ -f "resources/icon.png" ]; then
            npx @capacitor/assets generate --ios
          else
            echo "No resources/icon.png — shipping with the Capacitor placeholder icon."
          fi

      - name: Set the build number
        script: |
          # Every upload needs a build number unique within its version, or
          # App Store Connect rejects it after the archive has already run.
          # PROJECT_BUILD_NUMBER is Codemagic's own counter, so it always
          # increases without needing an App Store Connect lookup.
          cd ios/App
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"

      # No separate `pod install` step: `cap sync ios` above already runs it,
      # at the corrected deployment target. Running it twice only adds a way
      # for the two to disagree.

      - name: Set up code signing
        script: |
          # Fail here with a readable message rather than fifty lines into a
          # signing tool that reports a missing credential as "not found".
          for v in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_PRIVATE_KEY; do
            eval "value=\$$v"
            if [ -z "$value" ]; then
              echo "MISSING: $v is not set."
              echo "Add it to the Codemagic variable group named 'appstore'."
              echo "See CODEMAGIC_SETUP.md step 4."
              exit 1
            fi
          done
          echo "App Store Connect credentials present."

          keychain initialize

          # --create is the whole point. It makes the App Store provisioning
          # profile, and a distribution certificate if the account has none,
          # through the App Store Connect API. Without it this only looks for
          # profiles that already exist and fails on a brand-new bundle id.
          #
          # Apple allows three distribution certificates per account. If this
          # errors saying the limit is reached, revoke an unused one in
          # Certificates, Identifiers & Profiles rather than creating another.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          keychain add-certificates

          echo "=== provisioning profiles on disk ==="
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          ls -la "$PROFILE_DIR" 2>/dev/null || echo "(no profile directory)"
          if [ -z "$(ls -A "$PROFILE_DIR" 2>/dev/null)" ]; then
            echo "FATAL: fetch-signing-files produced no provisioning profile."
            echo "Nothing later can sign, so stopping here rather than failing"
            echo "twenty minutes into an archive."
            exit 1
          fi

          # Point at the app project explicitly. The default glob is
          # **/*.xcodeproj, which since pod install also matches
          # ios/App/Pods/Pods.xcodeproj — and applying the profile to the Pods
          # project leaves the App target unsigned. That surfaces much later as
          # `"App" requires a provisioning profile` during archive, which reads
          # like the profile was never fetched at all.
          xcode-project use-profiles --project "ios/App/App.xcodeproj"

          echo "=== signing settings now on the App target ==="
          xcodebuild -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME" -showBuildSettings 2>/dev/null \
            | grep -E "CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM" \
            | sort -u \
            || echo "(could not read build settings)"

      - name: Build the IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        # Same credentials as the signing step, from the `appstore` group.
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # Internal testers only: no Beta App Review, available as soon as
        # processing finishes. Add external groups once the tool has been
        # calibrated and you know what it can honestly claim.
        submit_to_testflight: true

      # No email block on purpose: this repo is public, and a hard-coded
      # address here is scrapeable by anyone.
      #
      # To get build notifications, create a variable group in Codemagic
      # holding NOTIFY_EMAIL, add `groups: [notifications]` under
      # `environment`, and restore:
      #
      #   email:
      #     recipients:
      #       - $NOTIFY_EMAIL
      #     notify: { success: true, failure: true }
      #
      # Left out rather than wired up because referencing a group that does
      # not exist yet fails the build outright — a bad trade for a
      # notification while you are still getting the first one green.
